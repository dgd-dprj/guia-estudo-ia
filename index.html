<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jornada IA da Marcelle</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
  <link rel="stylesheet" href="estilo.css">
</head>
<body>
  <header class="hud">
    <a class="hud-heroi" href="#/inicio" aria-label="Voltar ao mapa">
      <span class="hud-avatar" id="hud-avatar" aria-hidden="true"></span>
      <span class="hud-nome" id="hud-nome">Marcelle</span>
    </a>
    <div class="hud-status" aria-live="polite">
      <div class="hud-nivel"><span id="hud-nivel-emoji" aria-hidden="true">🌱</span> <span id="hud-nivel">Nv 1</span></div>
      <div class="hud-xp" title="Experiência">
        <div class="xp-barra"><div class="xp-cheia" id="hud-xp-barra"></div></div>
        <span id="hud-xp">0 XP</span>
      </div>
      <div class="hud-dias" title="Dias seguidos estudando">🔥 <span id="hud-dias">0</span> <span class="hud-rotulo">dias</span></div>
    </div>
    <nav class="hud-menu" aria-label="Menu">
      <a href="#/inicio"><span class="ico" aria-hidden="true">🗺️</span><span class="rotulo">Mapa</span></a>
      <a href="#/tarefas"><span class="ico" aria-hidden="true">✅</span><span class="rotulo">Tarefas</span></a>
      <a href="#/painel"><span class="ico" aria-hidden="true">📊</span><span class="rotulo">Painel</span></a>
      <a href="#/inventario"><span class="ico" aria-hidden="true">🎒</span><span class="rotulo">Inventário</span></a>
      <a href="#/conquistas"><span class="ico" aria-hidden="true">🏅</span><span class="rotulo">Conquistas</span></a>
      <a href="#/maria"><span class="ico" aria-hidden="true">📘</span><span class="rotulo">Maria</span></a>
      <a href="#/regras"><span class="ico" aria-hidden="true">📜</span><span class="rotulo">Regras</span></a>
      <a href="#/glossario"><span class="ico" aria-hidden="true">📖</span><span class="rotulo">Glossário</span></a>
    </nav>
  </header>

  <div class="faixa-atualizacao" id="faixa-atualizacao" role="status" hidden></div>

  <main id="conteudo" tabindex="-1"></main>

  <div class="avisos" id="avisos" aria-live="polite"></div>

  <script>
    // Carrega o estilo, os dados e o app sempre na versão publicada (versao.json), para o F5 comum e o
    // botão "Atualizar a tela" já trazerem o que mudou, sem o navegador reaproveitar arquivo antigo.
    // Sem versao.json (o guia rodando na máquina, com python -m http.server), usa a hora: sempre o arquivo do disco.
    (function () {
      function carregar(versao) {
        var v = "?v=" + encodeURIComponent(versao);
        var estilo = document.createElement("link");
        estilo.rel = "stylesheet";
        estilo.href = "estilo.css" + v;
        document.head.appendChild(estilo);
        ["dados/guia.js", "dados/tarefas.js", "dados/novidades.js", "app.js"].forEach(function (arquivo) {
          var s = document.createElement("script");
          s.src = arquivo + v;
          s.async = false; // na ordem: os dados antes do app
          document.body.appendChild(s);
        });
      }
      fetch("versao.json?t=" + Date.now(), { cache: "no-store" })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (j) { carregar(j && j.versao ? j.versao : String(Date.now())); })
        .catch(function () { carregar(String(Date.now())); });
    })();
  </script>
</body>
</html>
